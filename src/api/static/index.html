<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Agent — Review Panel</title>
<style>
  :root {
    --bg: #060a13;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-solid: #101724;
    --border: rgba(255, 255, 255, 0.09);
    --text: #e8edf6;
    --muted: #8291a8;
    --accent: #5eead4;
    --accent-2: #8b5cf6;
    --green: #34d399;
    --red: #fb7185;
    --amber: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 8% -10%, rgba(94, 234, 212, 0.10), transparent 60%),
      radial-gradient(1000px 600px at 100% 110%, rgba(139, 92, 246, 0.12), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: rgba(6, 10, 19, 0.72);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 18px rgba(94, 234, 212, 0.45);
    position: relative;
  }
  .logo::after {
    content: ""; position: absolute; inset: 7px;
    border-radius: 4px; background: var(--bg);
  }
  header h1 {
    font-size: 16px; margin: 0; font-weight: 650; letter-spacing: 0.02em;
    background: linear-gradient(90deg, #fff, var(--accent) 70%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .live-pill {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 12px;
    background: var(--panel);
  }
  #ws-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red); display: inline-block;
  }
  #ws-dot.on {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.45; }
  }

  /* ---------- layout ---------- */
  main {
    display: grid;
    grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
    gap: 22px;
    padding: 24px 28px;
    max-width: 1300px;
    margin: 0 auto;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  h2 {
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted);
    display: flex; align-items: center; gap: 10px;
  }
  h2::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }
  .count-pill {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #06131a;
    font-size: 11px; font-weight: 700;
    min-width: 20px; text-align: center;
    padding: 1px 7px; border-radius: 999px;
    letter-spacing: 0;
  }

  /* ---------- cards ---------- */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
    backdrop-filter: blur(12px);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .card.interactive:hover {
    transform: translateY(-2px);
    border-color: rgba(94, 234, 212, 0.35);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(94, 234, 212, 0.08);
  }
  .card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
    padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; color: #fff; background: #444;
    white-space: nowrap;
  }
  .date { color: var(--muted); font-size: 11.5px; margin-left: auto; white-space: nowrap; }
  .text { white-space: pre-wrap; margin: 8px 0; line-height: 1.55; }
  .hashtags { color: var(--accent); font-size: 12px; margin: 8px 0 2px; opacity: 0.9; }
  .media {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--muted);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 9px; margin-top: 8px;
    word-break: break-all;
  }
  .actions { display: flex; gap: 10px; margin-top: 14px; }

  /* ---------- buttons ---------- */
  button {
    border: none; border-radius: 9px;
    padding: 8px 18px;
    font-size: 13px; font-weight: 650; letter-spacing: 0.02em;
    cursor: pointer; color: #06131a;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.approve {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 4px 16px rgba(52, 211, 153, 0.25);
  }
  button.approve:hover:not(:disabled) { box-shadow: 0 6px 22px rgba(52, 211, 153, 0.45); }
  button.reject, button.confirm {
    background: rgba(251, 113, 133, 0.12);
    color: var(--red);
    border: 1px solid rgba(251, 113, 133, 0.4);
  }
  button.reject:hover:not(:disabled), button.confirm:hover:not(:disabled) {
    background: rgba(251, 113, 133, 0.25);
    box-shadow: 0 4px 16px rgba(251, 113, 133, 0.2);
  }
  button.cancel {
    background: rgba(255, 255, 255, 0.06);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  button.post-now {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 18px rgba(94, 234, 212, 0.3);
  }
  button.post-now:hover:not(:disabled) { box-shadow: 0 6px 26px rgba(139, 92, 246, 0.45); }

  /* ---------- status chips & activity rows ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.07em;
    padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    color: var(--muted);
    white-space: nowrap;
  }
  .chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .chip.review    { color: var(--amber); border-color: rgba(251, 191, 36, 0.45); }
  .chip.approved  { color: var(--accent); border-color: rgba(94, 234, 212, 0.45); }
  .chip.queued, .chip.publishing { color: var(--accent-2); border-color: rgba(139, 92, 246, 0.5); }
  .chip.published { color: var(--green); border-color: rgba(52, 211, 153, 0.45); }
  .chip.rejected, .chip.failed { color: var(--red); border-color: rgba(251, 113, 133, 0.45); }

  #recent { max-height: 75vh; overflow-y: auto; }
  #recent::-webkit-scrollbar { width: 6px; }
  #recent::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }
  .row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  .row:last-child { border-bottom: none; }
  .row .snippet { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
  .row .date { margin-left: 0; }
  .empty { color: var(--muted); padding: 14px 4px; }
  .err { color: var(--red); font-size: 12px; margin-top: 8px; }

  /* ---------- compose box ---------- */
  #compose { position: relative; overflow: hidden; }
  #compose::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(400px 120px at 20% 0%, rgba(94, 234, 212, 0.07), transparent 70%);
  }
  textarea {
    width: 100%;
    background: rgba(6, 10, 19, 0.55);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font: inherit; line-height: 1.5;
    padding: 11px 13px;
    resize: vertical;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea:focus {
    outline: none; border-color: rgba(94, 234, 212, 0.55);
    box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.12);
  }
  input[type="text"], select {
    background: rgba(6, 10, 19, 0.55);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font: inherit; font-size: 13px;
    padding: 9px 13px;
  }
  input[type="text"] { width: 100%; margin-top: 10px; }
  input[type="text"]:focus, select:focus {
    outline: none; border-color: rgba(94, 234, 212, 0.55);
    box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.12);
  }
  select option { background: #101724; }
  .compose-row { display: flex; align-items: center; gap: 9px; margin-top: 12px; flex-wrap: wrap; }
  #compose-media { display: none; }
  .attach-label {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600;
    color: var(--muted);
    border: 1px dashed rgba(255, 255, 255, 0.2);
    border-radius: 9px; padding: 7px 13px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .attach-label:hover { color: var(--accent); border-color: rgba(94, 234, 212, 0.5); }
  #file-name { font-size: 12px; color: var(--accent); }
  .plat-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 13px;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--muted);
    cursor: pointer; user-select: none;
    transition: all 0.15s ease;
  }
  .plat-chip:hover { border-color: rgba(94, 234, 212, 0.4); }
  .plat-chip:has(input:checked) {
    border-color: rgba(94, 234, 212, 0.7);
    color: var(--accent);
    background: rgba(94, 234, 212, 0.08);
    box-shadow: 0 0 12px rgba(94, 234, 212, 0.15);
  }
  .plat-chip input { accent-color: var(--accent); margin: 0; display: none; }
  .plat-chip.no-acct { opacity: 0.45; }
  .compose-results { margin-top: 12px; font-size: 12.5px; }
  .compose-results .ok { color: var(--green); }
  .compose-results .bad { color: var(--red); }

  /* ---------- inline reject ---------- */
  .reject-box { display: flex; gap: 8px; margin-top: 12px; }
  .reject-box input {
    flex: 1;
    background: rgba(6, 10, 19, 0.55);
    border: 1px solid rgba(251, 113, 133, 0.35);
    border-radius: 9px;
    color: var(--text);
    font: inherit; font-size: 13px;
    padding: 7px 12px;
  }
  .reject-box input:focus {
    outline: none; border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(251, 113, 133, 0.12);
  }

  /* ---------- entrance animation ---------- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card { animation: fadeUp 0.3s ease; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo"></span>
    <h1>Social Agent — Review Panel</h1>
  </div>
  <span style="display:flex;align-items:center;gap:10px">
    <a class="live-pill" href="/panel/settings.html" style="text-decoration:none">&#9881; Settings</a>
    <span class="live-pill"><span id="ws-dot"></span>live updates</span>
  </span>
</header>
<main>
  <section>
    <h2>New post</h2>
    <div class="card" id="compose">
      <textarea id="compose-text" rows="3" placeholder="Write your post..."></textarea>
      <div class="compose-row">
        <label class="attach-label" for="compose-media">&#128206; Attach media</label>
        <input type="file" id="compose-media" accept="image/*,video/*">
        <span id="file-name"></span>
      </div>
      <div class="compose-row" id="compose-platforms"></div>
      <div class="actions">
        <button class="post-now" id="compose-submit" onclick="onCompose()">Post now</button>
      </div>
      <div class="err" id="compose-err" hidden></div>
      <div class="compose-results" id="compose-results"></div>
    </div>
    <h2>Generate with AI</h2>
    <div class="card" id="generate">
      <input type="text" id="gen-topic" placeholder="Topic (optional — leave empty to discover hot topics in your niche)">
      <div class="compose-row">
        <select id="gen-brand"><option value="">— no brand / niche —</option></select>
        <select id="gen-type">
          <option value="mixed">mixed</option>
          <option value="text">text</option>
          <option value="image">image</option>
          <option value="video">video</option>
        </select>
      </div>
      <div class="compose-row" id="gen-platforms"></div>
      <div class="actions">
        <button class="post-now" id="gen-submit" onclick="onGenerate()">Generate drafts</button>
      </div>
      <div class="err" id="gen-err" hidden></div>
      <div class="compose-results" id="gen-results"></div>
    </div>
    <h2>Pending approvals <span class="count-pill" id="pending-count">0</span></h2>
    <div id="pending"></div>
  </section>
  <section>
    <h2>Recent activity</h2>
    <div id="recent" class="card"></div>
  </section>
</main>
<script>
const pendingEl = document.getElementById("pending");
const recentEl = document.getElementById("recent");
const countEl = document.getElementById("pending-count");
const wsDot = document.getElementById("ws-dot");

const PLATFORM_COLORS = {
  facebook:  { bg: "#1877f2", fg: "#fff" },
  instagram: { bg: "linear-gradient(45deg,#f09433,#dc2743,#bc1888)", fg: "#fff" },
  linkedin:  { bg: "#0a66c2", fg: "#fff" },
  youtube:   { bg: "#ff0033", fg: "#fff" },
  twitter:   { bg: "#1d9bf0", fg: "#fff" },
  tiktok:    { bg: "#010101", fg: "#25f4ee" },
};

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function fmtDate(value) {
  if (!value) return "";
  const d = new Date(value.endsWith("Z") ? value : value + "Z");
  return isNaN(d) ? esc(value) : d.toLocaleString();
}

function platBadge(platform) {
  const c = PLATFORM_COLORS[platform] || { bg: "#444", fg: "#fff" };
  return `<span class="badge" style="background:${c.bg};color:${c.fg}">${esc(platform)}</span>`;
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) { /* ignore */ }
    throw new Error(detail);
  }
  return res.json();
}

/* Skip re-renders when data is unchanged — avoids flicker from the 5s poll
   and protects any in-progress interaction inside the list. */
let lastPendingJSON = "";
let lastRecentJSON = "";

function renderPending(items) {
  countEl.textContent = items.length;
  if (!items.length) {
    pendingEl.innerHTML = '<div class="empty">Nothing waiting for review.</div>';
    return;
  }
  pendingEl.innerHTML = items.map((c) => {
    const tags = (c.hashtags || []).map((t) => "#" + esc(t)).join(" ");
    const media = (c.media_urls || [])
      .map((u) => `<div class="media">&#128206; ${esc(u)}</div>`).join("");
    return `
      <div class="card interactive" data-id="${esc(c.id)}">
        <div class="top">
          ${platBadge(c.platform)}
          <span class="date">${fmtDate(c.created_at)}</span>
        </div>
        <div class="text">${esc(c.text || "(no text)")}</div>
        ${tags ? `<div class="hashtags">${tags}</div>` : ""}
        ${media}
        <div class="actions">
          <button class="approve" onclick="onApprove('${esc(c.id)}', this)">Approve</button>
          <button class="reject" onclick="onReject('${esc(c.id)}', this)">Reject</button>
        </div>
        <div class="err" hidden></div>
      </div>`;
  }).join("");
}

function renderRecent(items) {
  if (!items.length) {
    recentEl.innerHTML = '<div class="empty">No activity yet.</div>';
    return;
  }
  recentEl.innerHTML = items.map((c) => `
    <div class="row">
      ${platBadge(c.platform)}
      <span class="chip ${esc(c.status)}">${esc(c.status)}</span>
      <span class="snippet">${esc((c.text || "").slice(0, 80))}</span>
      <span class="date">${fmtDate(c.created_at)}</span>
    </div>`).join("");
}

function showError(id, message) {
  const card = pendingEl.querySelector(`[data-id="${id}"] .err`);
  if (card) { card.textContent = message; card.hidden = false; }
}

async function onApprove(id, btn) {
  btn.disabled = true;
  try {
    await api(`/api/approvals/${id}/approve`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ actor: "reviewer" }),
    });
    await refresh();
  } catch (e) {
    showError(id, e.message);
    btn.disabled = false;
  }
}

async function onReject(id, btn) {
  // Inline feedback box — window.prompt() is blocked in several embedded
  // browsers, which silently swallowed rejections before.
  const card = pendingEl.querySelector(`[data-id="${id}"]`);
  const actions = card.querySelector(".actions");
  if (card.querySelector(".reject-box")) return; // already open
  actions.hidden = true;
  const box = document.createElement("div");
  box.className = "reject-box";
  box.innerHTML = `
    <input type="text" placeholder="Feedback (optional)" autofocus>
    <button class="confirm">Confirm</button>
    <button class="cancel">Cancel</button>`;
  card.appendChild(box);
  const input = box.querySelector("input");
  box.querySelector(".cancel").onclick = () => { box.remove(); actions.hidden = false; };
  const submit = async () => {
    box.querySelector(".confirm").disabled = true;
    try {
      await api(`/api/approvals/${id}/reject`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ actor: "reviewer", feedback: input.value.trim() }),
      });
      box.remove(); // unblock the pending-list re-render, then refresh
      await refresh();
    } catch (e) {
      box.remove();
      actions.hidden = false;
      btn.disabled = false;
      showError(id, e.message);
    }
  };
  box.querySelector(".confirm").onclick = submit;
  input.onkeydown = (ev) => { if (ev.key === "Enter") submit(); };
  input.focus();
}

async function loadPending() {
  // An open reject-feedback box lives inside the pending list — re-rendering
  // now would destroy it mid-edit, so defer this cycle.
  if (pendingEl.querySelector(".reject-box")) return;
  try {
    const items = await api("/api/approvals/pending");
    const json = JSON.stringify(items);
    if (json !== lastPendingJSON) {
      lastPendingJSON = json;
      renderPending(items);
    } else {
      countEl.textContent = items.length;
    }
  } catch (e) {
    pendingEl.innerHTML = `<div class="empty">Failed to load: ${esc(e.message)}</div>`;
  }
}

async function loadRecent() {
  try {
    const items = (await api("/api/contents")).slice(0, 20);
    const json = JSON.stringify(items);
    if (json !== lastRecentJSON) {
      lastRecentJSON = json;
      renderRecent(items);
    }
  } catch (e) {
    recentEl.innerHTML = `<div class="empty">Failed to load: ${esc(e.message)}</div>`;
  }
}

async function refresh() {
  lastPendingJSON = lastRecentJSON = ""; // force re-render after own action
  await Promise.all([loadPending(), loadRecent()]);
}

/* ---------------- compose box ---------------- */

const composeText = document.getElementById("compose-text");
const composeMedia = document.getElementById("compose-media");
const composePlats = document.getElementById("compose-platforms");
const composeSubmit = document.getElementById("compose-submit");
const composeErr = document.getElementById("compose-err");
const composeResults = document.getElementById("compose-results");
const fileName = document.getElementById("file-name");

composeMedia.addEventListener("change", () => {
  fileName.textContent = composeMedia.files[0] ? composeMedia.files[0].name : "";
});

async function loadComposePlatforms() {
  try {
    const platforms = await api("/api/platforms");
    composePlats.innerHTML = platforms.map((p) => `
      <label class="plat-chip ${p.has_account ? "" : "no-acct"}"
             title="${esc(p.name)} via ${esc(p.via)}${p.has_account ? "" : " — no account registered, posting will fail"}">
        <input type="checkbox" value="${esc(p.name)}"> ${esc(p.name)}${p.has_account ? "" : " &#9888;"}
      </label>`).join("");
  } catch (e) {
    composePlats.innerHTML = `<span class="empty">Failed to load platforms: ${esc(e.message)}</span>`;
  }
}

async function onCompose() {
  const platforms = [...composePlats.querySelectorAll("input:checked")]
    .map((cb) => cb.value);
  composeErr.hidden = true;
  composeResults.innerHTML = "";
  if (!platforms.length) {
    composeErr.textContent = "Pick at least one platform.";
    composeErr.hidden = false;
    return;
  }
  const form = new FormData();
  form.append("text", composeText.value);
  form.append("platforms", platforms.join(","));
  if (composeMedia.files[0]) form.append("media", composeMedia.files[0]);

  composeSubmit.disabled = true;
  try {
    const res = await api("/api/compose", { method: "POST", body: form });
    composeResults.innerHTML = res.results.map((r) => {
      const ok = r.status === "published";
      const detail = ok
        ? (r.publish_result && r.publish_result.dry_run ? "published (dry-run)" : "published")
        : `${esc(r.status)}${r.publish_result && r.publish_result.error ? " — " + esc(r.publish_result.error) : ""}`;
      return `<div class="${ok ? "ok" : "bad"}">${esc(r.platform)}: ${detail}</div>`;
    }).join("");
    composeText.value = "";
    composeMedia.value = "";
    fileName.textContent = "";
    await refresh();
  } catch (e) {
    composeErr.textContent = e.message;
    composeErr.hidden = false;
  } finally {
    composeSubmit.disabled = false;
  }
}

/* ---------------- AI generation (agent pipeline) ---------------- */

const genTopic = document.getElementById("gen-topic");
const genBrand = document.getElementById("gen-brand");
const genType = document.getElementById("gen-type");
const genPlats = document.getElementById("gen-platforms");
const genSubmit = document.getElementById("gen-submit");
const genErr = document.getElementById("gen-err");
const genResults = document.getElementById("gen-results");

async function loadGenForm() {
  try {
    const platforms = await api("/api/platforms");
    genPlats.innerHTML = platforms.map((p) => `
      <label class="plat-chip ${p.has_account ? "" : "no-acct"}" title="${esc(p.name)}">
        <input type="checkbox" value="${esc(p.name)}"> ${esc(p.name)}${p.has_account ? "" : " &#9888;"}
      </label>`).join("");
  } catch (e) { /* non-fatal */ }
  try {
    const brands = await api("/api/brands");
    genBrand.innerHTML = '<option value="">— no brand / niche —</option>' +
      brands.map((b) =>
        `<option value="${esc(b.id)}">${esc(b.name)} (${esc(b.niche)})</option>`).join("");
  } catch (e) { /* non-fatal */ }
}

async function onGenerate() {
  const platforms = [...genPlats.querySelectorAll("input:checked")].map((cb) => cb.value);
  genErr.hidden = true;
  genResults.innerHTML = "";
  if (!platforms.length) {
    genErr.textContent = "Pick at least one platform.";
    genErr.hidden = false;
    return;
  }
  if (!genTopic.value.trim() && !genBrand.value) {
    genErr.textContent = "Enter a topic or pick a brand (its niche guides discovery).";
    genErr.hidden = false;
    return;
  }
  genSubmit.disabled = true;
  genSubmit.textContent = "Generating… (local LLM may take a minute)";
  try {
    const task = await api("/api/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        brand_id: genBrand.value || null,
        topic: genTopic.value.trim() || null,
        platforms,
        content_type: genType.value,
      }),
    });
    genResults.innerHTML =
      `<div class="ok">Drafts generated about “${esc(task.topic || "hot topics")}” — see the approval queue below.</div>`;
    genTopic.value = "";
    await refresh();
  } catch (e) {
    genErr.textContent = e.message;
    genErr.hidden = false;
  } finally {
    genSubmit.disabled = false;
    genSubmit.textContent = "Generate drafts";
  }
}

function connectWs() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws/status`);
  ws.onopen = () => wsDot.classList.add("on");
  ws.onclose = () => {
    wsDot.classList.remove("on");
    setTimeout(connectWs, 3000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = () => refresh();
}

refresh();
loadComposePlatforms();
loadGenForm();
setInterval(loadPending, 5000);
setInterval(loadRecent, 5000);
connectWs();
</script>
